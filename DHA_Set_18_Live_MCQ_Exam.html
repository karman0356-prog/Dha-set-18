lovir. The team is concerned about his altered mental status and visual changes. Which of the following is'the most likely reason for his alter=¢ mental status?", "options": {"A": "This is normal, and no need for intervention", "B": "Trimethoprim/sulfamethoxazole : Hl", "C": "Valganciclovir 1", "D": "Voriconazole"}, "answer": "D"}, {"source": 3386, "stem": "Which of the following is most likely associated with photosensitivity?", "options": {"A": "Atorvastatin", "B": "Cephalexin", "C": "Doxycycline", "D": "Metformin & Scanned with OKEN Scanner"}, "answer": "C"}, {"source": 3391, "stem": "A 63-year-old man presents to the Family Medicine Clinic for a routine follow-up. During the visit, i will meet the pharmacist for the first time to review and manage his medications. Which of the following is most appropriate fo gathering patient information?", "options": {"A": "Use close-ended questions for the entire session |", "B": "Assess factors that may influence medication use and compliance** le", "C": "Patient chart is the most reliable source to verify patient allergy ul ;", "D": "Verify the medications considering the prescription rather than over-the-counter or herbal ones fs"}, "answer": null}, {"source": 3392, "stem": "A 63-year-old man presented to the Diabetes Clinic for a follow-up. He has a past medical history significant for type 2 diabetes, hypertension, dyslipidemia, and percutaneous coronary intervention (stent) post 1 acute coronary syndrome 6 months ago. Current medications include insulin glargine subcutaneously daily, insulin lispro, metformin, aspirin, and bisoprolol (see lab results). Which of the following is the most important drug-related problem occurring?", "options": {"A": "Therapeutic failure", "B": "Therapeutic duplication", "C": "Unnecessary drug therap", "D": "Need for additional drug therapy"}, "answer": null}, {"source": 3394, "stem": "A 36-year-old woman presented to the community pharmacy asking about a medication that could help her lose weight. She reports no significant past medical history, but she just loves to eat a lot of sweets. Which of the following is the most appropriate weight loss recommendation for the patient? ----------TABLE-----------", "options": {"A": "Recommend lorcaserin for weight loss", "B": "Refer to a surgeon to consider bariatric surger", "C": "Refer to an endocrinologist physician to consider liraglutide", "D": "Refer to a dietitian to develop a patient-centered reduced caloric plan"}, "answer": null}, {"source": 3395, "stem": "A 55-year-old man was newly diagnosed with valvular atrial fibrillation and will be started on warfarin 7.5 mg orally daily (see report). Rapid Single Nucleotide Polymorphism (SNP) for CYP2C9 and VKORC1 (1639A) genotypes. Which of the following is the most appropriate recommendation for him, based on his genotype?", "options": {"A": "Increase warfarin dose", "B": "Decrease warfarin dose", "C": "Change warfarin to apixaban", "D": "Keep warfarin dose the same"}, "answer": "B"}, {"source": 3397, "stem": "A 23-year-old Asian man presented to the Emergency Department with a major seizure. During his admission, he was diagnosed with generalized tonic-clonic seizures. His neurologist wants to start him on anti-seizure medication, but his genetic testing showed a positive HLA-B15S02 allele. Which of the following anti-seizure medications is the most appropriate to start for the patient?", "options": {"A": "Phenytoin", "B": "Lamotrigine", "C": "Levetiracetam", "D": "Carbamazepine"}, "answer": "C"}, {"source": 3398, "stem": "A 45-year-old man presents to the primary care clinic for a routine follow-up visit. During the visit, he was diagnosed with hypertension. His past medical history was significant for diabetes mellitus type 2, gout, and hypothyroidism (10-year ASCVD risk = 18.5%). His home medications include allopurinol, aspirin, levothyroxine, furosemide, and atorvastatin (see lab results). -----------TABLE--------- Which of the following recommendations is the most appropriate to manage his hypertension?", "options": {"A": "Initiate lisinopril", "B": "Reassess in 3 to 6 months", "C": "Initiate hydrochlorothiazide", "D": "Initiate lisinopril and amlodipine"}, "answer": "D"}, {"source": 3399, "stem": "A 66-year-old woman presented to the Emergency Department with dyslipidemia and drug-eluting stent placement 2 months ago after non-ST segment elevation myocardial infarction. Her medications include aspirin, clopidogrel, atorvastatin, and warfarin. She admits to being compliant with her medications, yet her cardiologist decided to change clopidogrel to ticagrelor. Which of the following best describes the reason for clopidogrel change for this patient?", "options": {"A": "Drug interaction with aspirin", "B": "Drug interaction with warfarin", "C": "Potential of CYP2C19 poor metabolism O. Potential of CYP2C19 polymorphism", "D": "[Option not reliably readable in scan]"}, "answer": "C"}, {"source": 3400, "stem": "A 56-year-old postmenopausal woman presented to the Medication Therapy Management Clinic after being diagnosed with osteoporosis. Her past medical history is significant for diabetes mellitus, diabetic neuropathy, and osteoporosis. Her medications include metformin and empagliflozin. She was prescribed alendronate, calcium, and vitamin D. Which of the following is the best recommendation for the patient?", "options": {"A": "Refer to the dietitian to develop DASH diet", "B": "Refer to her endocrinologist to initiate teriparatide", "C": "Instruct the patient/caregiver to stop canagliflozin 0 Refer to the dentist before initiating alendronate** & Scanned with OKEN Scanner", "D": "[Option not reliably readable in scan]"}, "answer": null}, {"source": 3401, "stem": "A 54-year-old woman presented to the Community Pharmacy complaining of abdominal pain, bloating, and loss of appetite. Her past medical history is significant for diabetes mellitus type 1, hypertension, and dyslipidemia. She cannot provide information about her latest laboratory test results, but she asks the pharmacist to recommend a medication to help her symptoms. Which of the following is the best recommendation for the patient?", "options": {"A": "Dispense metronidazole", "B": "Dispense metoclopramide", "C": "Refer to the primary care physician", "D": "Refer to the emergency department"}, "answer": "C"}, {"source": 3402, "stem": "A 53-year-old man visited the outpatient clinic for a routine follow-up (see lab result). Which of the following is the most appropriate approach for this patient?", "options": {"A": "Start antidiabetic therapy .", "B": "Start regular aerobic exercise", "C": "Initiate antihypertensive therap", "D": "Recommend a diet with 900 kcal/da"}, "answer": null}, {"source": 3403, "stem": "A 66-year-old woman has a history of atrial fibrillation for which she takes warfarin. Her past medical history includes hyperlipidemia and postmenopausal hot flashes. She visited the Anticoagulation Clinic complaining of gum bleeding, especially after tooth brushing. At home, she takes atorvastatin, estradiol, and Dong Quai supplement (see lab results). Which of the following management approaches is appropriate for this patient?", "options": {"A": "Stop atorvastatin", "B": "Start norethindrone", "C": "Stop Dong Quai supplement", "D": "Change the type of toothpaste she uses"}, "answer": "C"}, {"source": 3404, "stem": "A 21-year-old woman visited the community pharmacy complaining of insomnia, especially before college iB p exams. She has no past medical history. She also denies smoking and drinking caffeine. Which of the following should be recommended to help the patient?", "options": {"A": "Take niacin (vitamin 83)", "B": "Sleep in a quiet environment", "C": "Obtain a prescription for trazodone", "D": "Exercise within an hour before bedtime & Scanned with OKEN Scanner"}, "answer": "B"}, {"source": 3406, "stem": "A5S2-year-old has chronic obstructive pulmonary disease (COPD) and visited the outpatient clinic ably readable in scan]"}, "answer": "C"}, {"source": 3410, "stem": "A 67-year-old woman with a history of diabetes, dyslipidemia, and obesity. Her selfmonitoring blood glucose readings show fasting blood glucose averaging 120 mg/dL, and her post-prandial blood glucose averaging 280 mg/dL. Her current diabetes therapeutic regimen is metformin 750 mg XR 2 tablets daily and insulin glargine 22 units SubQ at bedtime. What is the most appropriate management for this patient?", "options": {"A": "Start acarbose", "B": "Start liraglutide", "C": "Increase metformin dose", "D": "Increase insulin glargine dose"}, "answer": "B"}, {"source": 3411, "stem": "A 55-year-old man with type 2 diabetes and hypertension presents for routine annual check. He has family history of osteoporosis and hypertension. He is on lisinopril and metformin (see lab results). Which of the following problems should be addressed first?", "options": {"A": "Order bone profile", "B": "Adjust his diabetes regimen", "C": "Address his uncontrolled hypertension", "D": "Determine his eligibility to start a statin therap"}, "answer": null}, {"source": 3412, "stem": "An 18-year-old with type 1 diabetes mellitus presents to the Emergency Department with diabetic ketoacidosis (see lab results). What is the anion gap for this patient?", "options": {"A": "30", "B": "27", "C": "119 & Scanned with OKEN Scanner", "D": "[Option not reliably readable in scan]"}, "answer": "B"}, {"source": 3413, "stem": "A 68-year-old woman was admitted to the hospital with atrial fibrillation. She has a history of type 2 diabetes, hypertension, and dyslipidemia. She was started on metoprolol succinate for rate control. What is the most appropriate scoring system to determine whether to start an anticoagulant?", "options": {"A": "Caprini", "B": "Khorrana", "C": "HAS-BLED", "D": "CHA,DS2-VASc"}, "answer": "D"}, {"source": 3415, "stem": "A 61-year-old man presents with shortness of breath on exertion and rest, numbness, anc (swe extremity ede inel event", "D": "Drug related morbidit"}, "answer": null}, {"source": 3448, "stem": "A 16-year-old boy with suspected catheter related sepsis receives intravenous vancomycin 50 mg instead of SOO mg every 12 hours. Which of the following drug related problems would this be considered?", "options": {"A": "Over dosage", "B": "Adverse drug reaction", "C": "Sub-therapeutic dosage", "D": "Improper drug selection"}, "answer": "C"}, {"source": 3449, "stem": "Which of the following medication errors would be reduced by using smart infusion pumps?", "options": {"A": "Dispensing", "B": "Prescribing", "C": "Transcribing", "D": "Administration"}, "answer": "D"}, {"source": 3450, "stem": "Which of the following reflect a high quality care for a patient admitted with heart failure?", "options": {"A": "The formulary system", "B": "Thirty-day readmission rate", "C": "Medication discharge counseling", "D": "Routine inspections of drug storage areas"}, "answer": "B"}, {"source": 3451, "stem": "Which of the following is considered an order alerting pharmacist that an adverse drug reaction may have occurred?", "options": {"A": "Dextrose 50% bolus order for a patient on insulin", "B": "aPTT every 6 hours order for a patient on heparin infusion", "C": "Blood pressure daily monitoring for a patient on amlodipine", "D": "INR order prior to routine clinic visit for a patient on warfarin & Scanned with OKEN Scanner"}, "answer": "A"}, {"source": 3452, "stem": "Which of the following medication safety initiatives prevents medication errors during transitions of care?", "options": {"A": "Computerized physician order entr", "B": "Clinical decision support system", "C": "Medication use evaluation", "D": "Medication reconciliation"}, "answer": null}, {"source": 3453, "stem": "Which of the following indicates that there is a culture of patient safety in an organization?", "options": {"A": "Just culture", "B": "Blame culture", "C": "Punitive culture", "D": "Fault culture"}, "answer": "A"}, {"source
